# BeautifulRust clippy configuration. Copy to your crate or workspace root, next to
# Cargo.toml, alongside the [lints] block from lints.toml.

# Flag any function with a bool parameter, not just functions with four or more.
# A bool argument is unreadable at the call site (report(true)) and can't grow a
# third mode; use a two-variant enum or two methods instead.
max-fn-params-bools = 0

# Allow unwrap, expect, and printing in tests, where a panic is the assertion.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true

# std resolves a path on Windows to one starting `\\?\`, which git, the shells
# and the user rarely take; rho-ui's own canonicalize leaves that out.
disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "use rho_ui_core::platform::canonicalize, which leaves out Windows' \\\\?\\ prefix" },
    { path = "std::path::Path::canonicalize", reason = "use rho_ui_core::platform::canonicalize, which leaves out Windows' \\\\?\\ prefix" },
]
