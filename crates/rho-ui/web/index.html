<!doctype html>
<!-- rho-ui's web build: GPUI draws the whole page on a canvas it adds to
     the body. `cargo xtask web` puts this beside the wasm and fonts, and
     `rho-ui serve` serves it. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rho</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e22; }
      #loading { color: #9a9aa4; font: 14px system-ui, sans-serif; position: absolute; inset: 0;
                 display: flex; align-items: center; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="loading">Loading rho-ui…</div>
    <script type="module">
      import init from "./rho-ui.js";
      await init();
      document.getElementById("loading").remove();
    </script>
  </body>
</html>
