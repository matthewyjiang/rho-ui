[package]
name = "rho-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
# Reads a pasted image's format and size from its header. GPUI already
# builds this version with these decoders.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# LaTeX formulas in messages; see src/figures.rs.
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
# The terminal surface's emulator: Ghostty's libghostty-vt 1.0.1, built
# with Zig (see mise.toml). From git until a release with vt-1.0.1 is out.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb", default-features = false }
rho-ui-core = { path = "../rho-ui-core" }
# The channel from the terminal's reader thread to the UI.
futures = "0.3"
# The state database (store.rs). In a browser, rusqlite builds SQLite for
# wasm itself (sqlite-wasm-rs), and rho-ui keeps a copy in memory of the
# server's, which `serialize` moves between them.
rusqlite = { version = "0.41", features = ["bundled", "serialize"] }
# `Instant` and `SystemTime` that work in a browser too, where std's panic,
# as GPUI's executor's are; std's own elsewhere.
web-time = "1"
# Reads what forge CLIs such as gh print as JSON; see src/forge.rs. The
# values a surface's controls write to its data model (`surface_view/`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In a browser: the page's address, and the fonts it fetches (web.rs);
# pele, drawn by the browser's own JavaScript (pele.rs); `log` says what
# went wrong in the console, where GPUI's web platform sends it.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["History", "Location", "Response", "Storage", "Window"] }
# rusqlite's SQLite in a browser: this feature gives it the clock, sleep
# and randomness it links against, from the page.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }

# Off the browser: the terminal's pseudo-terminal, and QuickJS for Mermaid
# diagrams, which a browser runs as JavaScript itself.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The terminal surface's pseudo-terminal.
portable-pty = "0.9"
# Runs pele, vendored in vendor/pele, for Mermaid diagrams; see src/pele.rs.
rquickjs = "0.11"

# `rho-ui serve` (src/serve.rs): HTTP and its WebSockets for the page, the
# token, and the runtime it all runs on. `query` reads `/socket?path=`.
[target.'cfg(unix)'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio", "ws"] }
getrandom = "0.3"
# `fs` reads the page's files, `net` listens and reaches the daemon's
# socket, `process` runs scripts.
tokio = { version = "1.36", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal"] }
# The web build `cargo xtask dist` builds in, with the `web` feature.
rust-embed = { version = "8", features = ["interpolate-folder-path"], optional = true }

[features]
# Builds the web build in target/web-gz, which `cargo xtask dist` makes,
# into `rho-ui serve`.
web = ["dep:rust-embed"]

[lints]
workspace = true

[dev-dependencies]
# Offscreen windows, simulated input and element queries for the UI tests.
# Same source and version as the normal dependency, so features unify.
gpui-kit = { workspace = true, features = ["test-support"] }
rho-ui-core = { path = "../rho-ui-core", features = ["test-support"] }
# Files to attach in tests.
tempfile = "3"

# The UI tests' text system on macOS, the one GPUI's Mac platform makes,
# built alone: the platform must be made on the main thread, and tests run
# on others. Same version as GPUI Kit pins, so features unify.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-apple = { package = "gpui-pre-apple", version = "=0.3.12", features = ["font-kit"] }

# GPUI has no offscreen renderer for Windows, so there the UI tests draw with
# its wgpu one, on Mesa lavapipe as on Linux. Same version as GPUI Kit pins.
[target.'cfg(windows)'.dev-dependencies]
gpui-wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12", features = ["test-support"] }
