[package]
name = "rho-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
rho-ui-core = { path = "../rho-ui-core" }

[lints]
workspace = true

[dev-dependencies]
# Offscreen windows, simulated input and element queries for the UI tests.
# Same source and version as the normal dependency, so features unify.
gpui-kit = { workspace = true, features = ["test-support"] }
rho-ui-core = { path = "../rho-ui-core", features = ["test-support"] }
