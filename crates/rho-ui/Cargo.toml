[package]
name = "rho-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
# Reads a pasted image's format and size from its header. GPUI already
# builds this version with these decoders.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# LaTeX formulas in messages; see src/figures.rs.
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
# The terminal surface's emulator: Ghostty's libghostty-vt 1.0.1, built
# with Zig (see mise.toml). From git until a release with vt-1.0.1 is out.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb", default-features = false }
# The terminal surface's pseudo-terminal.
portable-pty = "0.9"
rho-ui-core = { path = "../rho-ui-core" }
# The channel from the terminal's reader thread to the UI.
futures = "0.3"
# Runs pele, vendored in vendor/pele, for Mermaid diagrams; see src/pele.rs.
rquickjs = "0.11"
rusqlite = { version = "0.41", features = ["bundled"] }

[lints]
workspace = true

[dev-dependencies]
# Offscreen windows, simulated input and element queries for the UI tests.
# Same source and version as the normal dependency, so features unify.
gpui-kit = { workspace = true, features = ["test-support"] }
rho-ui-core = { path = "../rho-ui-core", features = ["test-support"] }
# Reads the theme file in its test.
serde_json = "1"
# Files to attach in tests.
tempfile = "3"
