[package]
name = "rho-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
# Reads a pasted image's format and size from its header. GPUI already
# builds this version with these decoders.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rho-ui-core = { path = "../rho-ui-core" }
rusqlite = { version = "0.41", features = ["bundled"] }

[lints]
workspace = true

[dev-dependencies]
# Offscreen windows, simulated input and element queries for the UI tests.
# Same source and version as the normal dependency, so features unify.
gpui-kit = { workspace = true, features = ["test-support"] }
rho-ui-core = { path = "../rho-ui-core", features = ["test-support"] }
# Reads the theme file in its test.
serde_json = "1"
# Files to attach in tests.
tempfile = "3"
