[package]
name = "rho-ui-serve"
version = "0.1.0"
description = "Serves rho-ui's web build, and does on this machine what the browser can't"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# HTTP, its WebSockets and the page's files. `query` reads `/socket?path=`.
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio", "ws"] }
# Splits a WebSocket to read and write it at once.
futures = "0.3"
# The token: 32 bytes from the OS.
getrandom = "0.3"
# The pseudo-terminal of `/shell`, as the desktop app's terminal has.
portable-pty = "0.9"
# The wire types the client speaks (`rho_ui_core::server::wire`).
rho-ui-core = { path = "../rho-ui-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `net` listens and reaches the daemon's socket; `process` runs scripts;
# `fs` reads the page's files.
tokio = { version = "1.36", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal"] }

[dev-dependencies]
rho-ui-core = { path = "../rho-ui-core", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
