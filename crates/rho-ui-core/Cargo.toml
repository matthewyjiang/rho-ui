[package]
name = "rho-ui-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Everything the desktop UI needs from the rho daemon, with no GUI dependency.
[features]
# `fake_daemon`: a scripted daemon for tests, this crate's and rho-ui's.
test-support = ["dep:tempfile", "tokio/time"]

[dependencies]
# The A2UI processor behind the surfaces a session's `ui` tool shows
# (`surface.rs`).
a2ui = { path = "../a2ui" }
# Prompt and user-message images travel base64-encoded.
base64 = "0.22"
# Reads and writes a surface's date fields (`surface/field.rs`). The
# version a2ui builds.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# Highlights what a search matched, with the pattern rho's grep used.
regex = "1"
rho-protocol.workspace = true
# Reads `rho update --check --json` (`rho_install.rs`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = { version = "3", optional = true }
thiserror = "2"
# The runtime rho-protocol's `Client` needs for the socket; see `daemon.rs`.
# `process` and `io-util` run ssh for a daemon on another machine (`ssh.rs`).
tokio = { version = "1.36", features = ["io-util", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
futures = "0.3"
rho-ui-core = { path = ".", features = ["test-support"] }
smol = "2"
tempfile = "3"

[lints]
workspace = true
