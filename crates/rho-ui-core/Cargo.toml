[package]
name = "rho-ui-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Everything the desktop UI needs from the rho daemon, with no GUI dependency.
[features]
# `fake_daemon`: a scripted daemon for tests, this crate's and rho-ui's.
test-support = ["dep:tempfile", "tokio/time"]

[dependencies]
# Prompt and user-message images travel base64-encoded.
base64 = "0.22"
# Highlights what a search matched, with the pattern rho's grep used.
regex = "1"
rho-protocol.workspace = true
similar = "2"
tempfile = { version = "3", optional = true }
thiserror = "2"
# The runtime rho-protocol's `Client` needs for the socket; see `daemon.rs`.
tokio = { version = "1.36", features = ["net", "rt-multi-thread", "sync"] }

[dev-dependencies]
futures = "0.3"
rho-ui-core = { path = ".", features = ["test-support"] }
serde_json = "1"
smol = "2"

[lints]
workspace = true
