[tools]
# Rust 1.92 can't build gpui-pre-util (it uses slice::as_array, stable in 1.93).
# wasm32-unknown-unknown builds rho-ui for the browser, served by rho-ui-serve.
rust = { version = "1.98.0", components = "clippy,rustfmt", targets = "wasm32-unknown-unknown" }
# libghostty-vt has no prebuilt library for Linux: its build script builds
# Ghostty's vt-1.0.1 with Zig 0.17.
zig = "0.17.1"
# Turns rho-ui's wasm build into the JS glue the browser loads. Must match
# the wasm-bindgen version in Cargo.lock.
"cargo:wasm-bindgen-cli" = "0.2.130"
