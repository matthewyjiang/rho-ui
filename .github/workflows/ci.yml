name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR replaces its running check; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The install scripts run for real only once a release is published
      # (release.yml), so check them on each change.
      - name: Check install.sh
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh
      - name: Check install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          $errors
          exit $errors.Count

      # GPUI's system packages, Rust and Zig, and lavapipe, which the UI
      # tests render on (.github/actions/setup).
      - uses: ./.github/actions/setup
        with:
          lavapipe: true

      # A cold build takes 8 to 13 minutes a step, almost all of it
      # dependencies, so keep them even when a test fails. rust-cache keys
      # on the member crates' manifests, not the root one, so the root's
      # [profile] goes into the key here.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # The web build (docs/architecture.md, "In a browser"). One OS is
      # enough: the target is the same everywhere.
      - name: Clippy for the browser
        if: runner.os == 'Linux'
        run: cargo xtask clippy-web

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-shots-${{ matrix.os }}
          path: target/ui-shots/
          retention-days: 14
          if-no-files-found: ignore
