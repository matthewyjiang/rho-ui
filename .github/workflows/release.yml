name: Release

# A tag such as v0.1.0 builds rho-ui on each OS and publishes the builds as
# that tag's GitHub release. A tag with a pre-release part, such as
# v0.1.0-test.1, makes a draft instead, so trying this publishes nothing.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: macos-15
            platform: aarch64-macos
          - os: windows-2025
            platform: x86_64-windows
    runs-on: ${{ matrix.os }}
    # Five runs of this took 14 to 25 minutes a job (runs 44955077449,
    # 44957352847, 44962728276 twice, 44965686463).
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    # No version in the name, so scripts/install.sh and install.ps1 find
    # the latest release's at releases/latest/download/NAME.
    env:
      NAME: rho-ui-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # The About screen shows the crate's version, so a tag must name it.
      - name: Check the tag against rho-ui's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/rho-ui/Cargo.toml)
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *)
              echo "::error::the tag $GITHUB_REF_NAME doesn't name rho-ui's version, $version (crates/rho-ui/Cargo.toml)"
              exit 1
              ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # GPUI's system packages, Rust and Zig (.github/actions/setup).
      - uses: ./.github/actions/setup

      # Apple's clang can't build for wasm32, as the web build's SQLite
      # (sqlite-wasm-rs) must. xtask looks for Homebrew's `llvm`; the
      # runner has `llvm@18`, so name its clang instead.
      - name: Give the web build a clang for wasm
        if: runner.os == 'macOS'
        run: |
          llvm=$(brew --prefix llvm@18)
          if [ ! -x "$llvm/bin/clang" ]; then
            echo "::error::no clang in $llvm: name the Homebrew LLVM the runner image has now"
            exit 1
          fi
          echo "CC_wasm32_unknown_unknown=$llvm/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm/bin/llvm-ar" >> "$GITHUB_ENV"

      # The release builds what Cargo.lock says, or fails.
      - run: cargo fetch --locked
      # The build must take every Zig package from the Ghostty cache
      # (.github/actions/ghostty); one it fetched names an option that
      # action doesn't configure.
      - name: Build
        run: |
          ls "$GHOSTTY_SOURCE_DIR/zig-pkg" > "$RUNNER_TEMP/zig-pkg-cached"
          cargo xtask dist
          ls "$GHOSTTY_SOURCE_DIR/zig-pkg" > "$RUNNER_TEMP/zig-pkg-built"
          if ! diff "$RUNNER_TEMP/zig-pkg-cached" "$RUNNER_TEMP/zig-pkg-built"; then
            echo "::error::the build fetched Zig packages the Ghostty cache lacks (above): fetch them in .github/actions/ghostty"
            exit 1
          fi

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$NAME" dist
          cp target/release/rho-ui assets/rho-ui.desktop assets/icon.svg LICENSE "$NAME/"
          tar -czf "dist/$NAME.tar.gz" "$NAME"

      # Rho.app, signed ad hoc only: docs/guide/getting-started.md says how
      # to open one downloaded from a browser.
      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          app="$NAME/Rho.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources" dist
          cp target/release/rho-ui "$app/MacOS/"
          sed "s/@VERSION@/$VERSION/" assets/Info.plist > "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          icons="$RUNNER_TEMP/rho-ui.iconset"
          mkdir -p "$icons"
          for size in 16 32 128 256 512; do
            sips -s format png -z "$size" "$size" assets/icon.svg --out "$icons/icon_${size}x${size}.png"
            sips -s format png -z "$((size * 2))" "$((size * 2))" assets/icon.svg --out "$icons/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns -o "$app/Resources/rho-ui.icns" "$icons"
          codesign --force --sign - "$NAME/Rho.app"
          codesign --verify --strict "$NAME/Rho.app"
          cp LICENSE "$NAME/"
          ditto -c -k --keepParent "$NAME" "dist/$NAME.zip"

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$NAME" dist
          cp target/release/rho-ui.exe LICENSE "$NAME/"
          7z a -tzip "dist/$NAME.zip" "$NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    # It took 12 to 17 seconds, uploading 118 MB, in the same runs.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          draft=()
          case "$TAG" in *-*) draft=(--draft) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "rho-ui $TAG" --generate-notes "${draft[@]}" -- *

  # Installs the published release with the install scripts, as a user
  # would, so a build the scripts can't install fails here: the tag's
  # release first, then again as the latest, which updates it. A draft's
  # files aren't public, so only a published release is checked.
  install:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # What a Linux without a desktop needs, as docs/guide/browser.md says.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1 libxkbcommon0 libxkbcommon-x11-0
      # Piped in, as the docs' `curl ... | sh` and `irm ... | iex` do.
      - if: runner.os != 'Windows'
        run: |
          RHO_UI_VERSION="$GITHUB_REF_NAME" sh < scripts/install.sh
          sh < scripts/install.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:RHO_UI_VERSION = $env:GITHUB_REF_NAME
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          Remove-Item Env:RHO_UI_VERSION
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
