name: Set up the build
description: >-
  What building rho-ui needs on the runner: GPUI's system packages on Linux,
  Vulkan on lavapipe if asked, then Rust and Zig at the versions mise.toml
  pins. CI and Release share it.
inputs:
  lavapipe:
    description: >-
      Also install Mesa's lavapipe Vulkan driver, which the UI tests render
      on, on Linux and Windows. A build without tests doesn't need it.
    default: "false"
runs:
  using: composite
  steps:
    # GPUI's build dependencies, from GPUI Kit's installation guide, less
    # what this app doesn't link (WebKit, ALSA, OpenSSL, zstd).
    - name: Install system packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        LAVAPIPE: ${{ inputs.lavapipe }}
      run: |
        packages=(libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev)
        if [ "$LAVAPIPE" = true ]; then
          packages+=(libvulkan1 mesa-vulkan-drivers)
        fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "${packages[@]}"

    # GPUI has no offscreen renderer for Windows, so there the UI tests
    # draw with its wgpu one on Mesa lavapipe, as on Linux. Windows has no
    # Vulkan loader of its own: the runtime gives vulkan-1.dll, and the
    # action registers lavapipe as the driver.
    - name: Install Vulkan and lavapipe
      if: runner.os == 'Windows' && inputs.lavapipe == 'true'
      # v1.8.1. The runtime is pinned so a run doesn't pick up a new one.
      uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8
      with:
        vulkan_version: 1.4.363.0
        install_runtime_only: true
        install_lavapipe: true
        # It reads release lists through GitHub's API, whose anonymous
        # limit of 60 an hour a runner's shared address runs out of.
        github_token: ${{ github.token }}
    - name: Put the Vulkan loader on PATH
      if: runner.os == 'Windows' && inputs.lavapipe == 'true'
      shell: pwsh
      run: |
        if (-not $env:VULKAN_SDK) { throw "the Vulkan step set no VULKAN_SDK" }
        $loader = Get-ChildItem -Path $env:VULKAN_SDK -Recurse -Filter vulkan-1.dll |
          Where-Object { $_.DirectoryName -match 'x64' } | Select-Object -First 1
        if (-not $loader) { throw "no x64 vulkan-1.dll under $env:VULKAN_SDK" }
        $loader.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

    # Rust and Zig: libghostty-vt's build script builds Ghostty with Zig.
    - uses: jdx/mise-action@v5

    # Ghostty's source, and the Zig packages its build fetches, from the
    # cache: libghostty-vt's build script builds that and fetches nothing
    # when GHOSTTY_SOURCE_DIR names it. Without, each build clones Ghostty
    # and fetches its packages, 70 to 100 s of the network a run. A tag's
    # run restores what main's CI saved, as caches go.
    #
    # The key is libghostty-rs's rev in Cargo.lock, which pins the Ghostty
    # commit, so a new rev fetches anew. With GHOSTTY_SOURCE_DIR set the
    # build script doesn't check the commit itself.
    - name: Find the Ghostty that libghostty-vt builds
      id: ghostty
      shell: bash
      run: |
        rev=$(sed -n 's|^source = "git+https://github.com/Uzaaft/libghostty-rs?rev=[0-9a-f]*#\([0-9a-f]*\)"$|\1|p' Cargo.lock | sort -u)
        if [ "$(printf '%s\n' "$rev" | grep -c .)" != 1 ]; then
          echo "::error::Cargo.lock has no one git rev of libghostty-rs (found: ${rev:-none}); if libghostty-vt comes from crates.io now, update this step in .github/actions/setup"
          exit 1
        fi
        echo "rev=$rev" >> "$GITHUB_OUTPUT"
        echo "zig=$(zig version)" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/ghostty" >> "$GITHUB_OUTPUT"
    - name: Restore Ghostty
      id: restore-ghostty
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.ghostty.outputs.dir }}
        key: ghostty-${{ runner.os }}-${{ runner.arch }}-libghostty-rs-${{ steps.ghostty.outputs.rev }}-zig-${{ steps.ghostty.outputs.zig }}
    - name: Fetch Ghostty
      if: steps.restore-ghostty.outputs.cache-hit != 'true'
      shell: bash
      env:
        REV: ${{ steps.ghostty.outputs.rev }}
        DIR: ${{ steps.ghostty.outputs.dir }}
      run: |
        build_rs=$(curl -fsSL "https://raw.githubusercontent.com/Uzaaft/libghostty-rs/$REV/crates/libghostty-vt-sys/build.rs")
        repo=$(printf '%s\n' "$build_rs" | sed -n 's/^const GHOSTTY_REPO: &str = "\(.*\)";$/\1/p')
        commit=$(printf '%s\n' "$build_rs" | sed -n 's/^const GHOSTTY_COMMIT: &str = "\([0-9a-f]*\)";$/\1/p')
        if [ -z "$repo" ] || [ -z "$commit" ]; then
          echo "::error::libghostty-vt-sys's build.rs at $REV names no GHOSTTY_REPO and GHOSTTY_COMMIT for this step to read"
          exit 1
        fi
        echo "Ghostty $commit from $repo"
        rm -rf "$DIR"
        # As the build script clones it: long paths for Windows.
        git clone --config core.longpaths=true --filter=blob:none --no-checkout "$repo" "$DIR"
        git -C "$DIR" checkout --quiet "$commit"
        rm -rf "$DIR/.git"
        # Every package, lazy ones too, into the checkout's zig-pkg/: the
        # native build needs lazy ones that a plain --fetch leaves out.
        (cd "$DIR" && zig build --fetch=all)
    # Saved here, not at the job's end, so it holds no build output.
    - name: Save Ghostty
      if: steps.restore-ghostty.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.ghostty.outputs.dir }}
        key: ${{ steps.restore-ghostty.outputs.cache-primary-key }}
    - name: Build libghostty-vt from it
      shell: bash
      env:
        DIR: ${{ steps.ghostty.outputs.dir }}
      run: echo "GHOSTTY_SOURCE_DIR=$DIR" >> "$GITHUB_ENV"
